[/Script/Engine.RendererSettings]
; Target PC: GeForce GTX 1650 (4 GB). DX11 / SM5 only: SM6 and DX12-only features crashed the
; NVIDIA driver on this PC (Riskbound lesson). Lumen software tracing works on SM5.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Lumen reflections only on smooth surfaces (roughness below 0.35).
r.Lumen.Reflections.MaxRoughnessToTrace=0.35
; Virtual shadow maps off: conventional shadow maps, only the sun casts dynamic shadows (set per light).
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.GenerateMeshDistanceFields=True
; Nanite is not used for the hotel kit (4 GB VRAM).
r.Nanite.ProjectEnabled=False
; TSR is the upscaler offered in settings.
r.AntiAliasingMethod=4

[SystemSettings]
; Lumen's short-range AO crushed the dim upper walls of the B1 rooms to black (walk round 9, run with and
; without it); the screen-space AO intensity is lowered in KcHotel's post process for the same reason.
r.Lumen.ScreenProbeGather.ShortRangeAO=0

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
